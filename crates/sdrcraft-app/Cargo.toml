[package]
name = "sdrcraft-app"
version = "0.1.0"
edition = "2021"
description = "L3 egui desktop app calling sdrcraft-core in-process (Phase-1 scaffold; domain tabs land in Phase 4)"
license = "MIT"

[[bin]]
name = "sdrcraft"
path = "src/main.rs"

[dependencies]
sdrcraft-core = { path = "../sdrcraft-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
eframe = { workspace = true }
keyring = { workspace = true }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }

[lints]
workspace = true
