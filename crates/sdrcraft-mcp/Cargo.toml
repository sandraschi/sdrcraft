[package]
name = "sdrcraft-mcp"
version = "0.1.0"
edition = "2021"
description = "L2 CLI-first binary + MCP stdio server over sdrcraft-core (ArtCraft pattern)"
license = "MIT"

[[bin]]
name = "sdrcraft-mcp"
path = "src/main.rs"

[dependencies]
sdrcraft-core = { path = "../sdrcraft-core" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
